<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18384a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="referrer" content="no-referrer"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Chiavail Scheduler Notifications</title><style>body{font:17px system-ui,sans-serif;max-width:34rem;margin:3rem auto;padding:0 1.2rem;background:#f3f6f7;color:#18384a}h1{font-size:1.5rem}button{font:inherit;min-height:48px;padding:.6rem 1rem;margin:.5rem 0}textarea{box-sizing:border-box;width:100%;min-height:16rem;font:12px monospace}#message{min-height:3rem}small{display:block;line-height:1.6}</style><script src="public-config.js" defer></script><script src="app.js" defer></script></head><body>
<h1>Chiavail Scheduler Notifications</h1><p>通知状態: <strong id="state">未登録</strong></p>
<button id="enable" disabled>通知を有効にする</button><p id="message" role="status" aria-live="polite"></p>
<small>iPhone Safariで「ホーム画面に追加」し、そのアイコンから開いてください。購読情報は最初の1回だけ手動でPiへ転送します。</small>
<section id="export" hidden><h2>購読情報</h2><small>このJSONは公開せず、LocalSend等で自分のPC/Piへ転送してください。</small><textarea id="subscription" readonly aria-label="購読JSON" spellcheck="false"></textarea><button id="copy">購読情報をコピー</button><button id="download">JSONファイルとして保存</button></section>
</body></html>
